name: Feature request / 功能建议
description: Describe a math, chemistry, physics or note-taking task that Visual Math could make easier.
body:
  - type: textarea
    id: task
    attributes:
      label: What are you trying to do? / 希望完成什么操作？
      description: A short concrete example is more useful than a long feature list. English, 简体中文 and Español are welcome.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current difficulty / 当前不顺手的地方
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior / 建议的操作方式
