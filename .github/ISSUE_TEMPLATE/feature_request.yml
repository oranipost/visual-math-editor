name: Feature request / 功能建议
description: Describe a task that is difficult with the current editor.
body:
  - type: textarea
    id: task
    attributes:
      label: What are you trying to do? / 希望完成什么操作？
      description: A short concrete example is more useful than a long feature list. 中文和 English 均可。
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current difficulty / 当前不顺手的地方
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior / 建议的操作方式
