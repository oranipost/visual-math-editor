<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'none'; media-src 'none'; object-src 'none'">
  <title>Visual Math · 本地测试</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    :root { color-scheme: light; --interactive-accent:#7960c9; --font-interface:-apple-system,BlinkMacSystemFont,sans-serif; }
    body { margin:0; background:#eeedf2; color:#282332; font-family:var(--font-interface); }
    header { max-width:950px;margin:28px auto 20px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 24px; }
    header h1 {font-size:16px;font-weight:550;} header p {font-size:12px;color:#777;}
    button {cursor:pointer;} header button {padding:8px 12px;border:1px solid #d5d0e0;border-radius:6px;background:white;}
    .modal {box-sizing:border-box;margin:0 auto 32px;background:var(--background-primary,#fff);box-shadow:0 12px 55px #342c5320;}
    .report {max-width:720px;margin:24px auto;white-space:pre-wrap;font-size:12px;line-height:1.7;}
    body.dark {color-scheme:dark;background:#17161c;--background-primary:#242329;--background-secondary:#1e1d23;--background-modifier-border:#3b3945;--background-modifier-hover:#36323f;--text-normal:#e4e0ec;--text-muted:#aaa3b7;--text-on-accent:#fff;color:#e4e0ec;}
    .dark header button {background:#242329;color:#ddd;border-color:#48404f;}
  </style>
  <script defer src="preview.js"></script>
</head>
<body>
  <header><div><h1>Visual Math · 开发预览</h1><p>与插件共用编辑组件 · 网络连接已由 CSP 禁止</p></div><div><button id="theme">切换深色</button> <button id="reset">新建公式</button> <button id="selftest">运行组件测试</button></div></header>
  <main class="modal vme-modal" id="editor"></main>
  <pre class="report" id="result" aria-live="polite"></pre>
</body>
</html>
